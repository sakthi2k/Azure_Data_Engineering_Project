resources:
  jobs:
    Azure_End_To_End_Pipeline:
      name: Azure End_To_End_Pipeline
      tasks:
        - task_key: Parameters
          notebook_task:
            notebook_path: /Workspace/Users/UserDemo@gmail.com/ADF_Project/Azure
              Databricks ETE/Parameters
            source: WORKSPACE
        - task_key: Bronze_AutoLoader_Ingestion
          depends_on:
            - task_key: Parameters
          notebook_task:
            notebook_path: /Workspace/Users/UserDemo@gmail.com/ADF_Project/Azure
              Databricks ETE/Bronze_Layer
            source: WORKSPACE
        - task_key: Silver_Customer
          depends_on:
            - task_key: Bronze_AutoLoader_Ingestion
          notebook_task:
            notebook_path: /Workspace/Users/UserDemo@gmail.com/ADF_Project/Azure
              Databricks ETE/silver_customers
            source: WORKSPACE
        - task_key: Silver_Orders
          depends_on:
            - task_key: Bronze_AutoLoader_Ingestion
          notebook_task:
            notebook_path: /Workspace/Users/UserDemo@gmail.com/ADF_Project/Azure
              Databricks ETE/Silver_orders
            source: WORKSPACE
        - task_key: Silver_Products
          depends_on:
            - task_key: Bronze_AutoLoader_Ingestion
          notebook_task:
            notebook_path: /Workspace/Users/UserDemo@gmail.com/ADF_Project/Azure
