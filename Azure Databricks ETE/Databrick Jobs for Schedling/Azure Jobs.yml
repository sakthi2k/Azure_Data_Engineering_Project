            notebook_path: /Workspace/Users/UserDemo@gmail.com/ADF_Project/Azure
              Databricks ETE/Gold Products
            source: WORKSPACE
        - task_key: Fact_Orders
          depends_on:
            - task_key: Gold_Customers
            - task_key: Gold_Products
          notebook_task:
            notebook_path: /Workspace/Users/UserDemo@gmail.com/ADF_Project/Azure
              Databricks ETE/Gold Orders
